name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x64
            builder: --win --x64
          - runner: ubuntu-latest
            name: linux-x64
            builder: --linux --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"
          enable-cache: true
      - run: npm ci
      - run: uv sync --all-packages --all-groups --frozen
      - run: npm run check:versions
      - run: uv run --package agent-harness-api pytest apps/api/tests -q
      - run: npm run typecheck:web
      - run: npm run test:desktop
      - run: npm run build:web
      - run: npm run build:sidecar
      - run: npm --workspace apps/desktop run package -- ${{ matrix.builder }}
      - if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.js
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.js
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - run: node scripts/generate-update-metadata.js release "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
