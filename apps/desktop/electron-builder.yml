appId: com.ronoxdegrand.harness
productName: AI Agent Harness
artifactName: ai-agent-harness-${version}-${os}-${arch}.${ext}
asar: true
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - package.json
extraResources:
  - from: resources/backend/agent-harness-api
    to: backend
  - from: ../web/dist
    to: web
win:
  icon: ../web/public/favicon.svg
  target:
    - target: nsis
      arch: [x64]
mac:
  icon: ../web/public/favicon.svg
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
linux:
  icon: ../web/public/favicon.svg
  executableName: ai-agent-harness
  syncDesktopName: true
  category: Development
  target:
    - target: AppImage
      arch: [x64]
nsis:
  deleteAppDataOnUninstall: false
  include: installer.nsh
publish:
  provider: github
  owner: ronoxdegrand
  repo: harness
generateUpdatesFilesForAllChannels: true
